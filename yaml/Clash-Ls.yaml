# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: system
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true  
 
# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 🚀 所有-手动
    - ⚡ 所有-自动
    - 🇯🇵 日本-手动
    - 🇯🇵 日本-自动
    - 🇺🇸 静态-链式落地
    - 🇺🇸 美国-手动
    - 🇺🇸 美国-自动
    - 拒绝    

# ========================================================
#                  业务分流组
# ========================================================
proxy-groups:
  - {name: 🧪 Test, <<: *default}
  - {name: 🧠 AI, <<: *default}
  - {name: 💳 PayPal, <<: *default}
  - {name: 🛍️ Shopping, <<: *default}
  - {name: 📺 Youtube, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 🐦 Twitter, <<: *default}
  - {name: ✈️ Telegram, <<: *default}
  - {name: 🐱 GitHub, <<: *default}
  - {name: 🍏 Apple, <<: *default}
  - {name: 💻 微软, <<: *default}
  - {name: 🔍 Google, <<: *default}
  - {name: 🎥 Netflix, <<: *default}
  - {name: 📹 流媒体, <<: *default}
  - {name: 🎮 Steam, <<: *default}
  - {name: 🛑 国外, <<: *default}
  - {name: 🇨🇳 国内, <<: *default}
  - {name: ⚓ 其他, <<: *default}  
  # - {name: 🚫 Block, <<: *default}

  - name: 🚀 所有-手动
    type: select
    include-all: true
    exclude-filter: "(直连|拒绝|静态)"

  - name: ⚡ 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    exclude-filter: "(直连|拒绝|静态)"

  - name: 🇯🇵 🇺🇸 链式前置
    type: select
    proxies:
      - 🇯🇵 日本-故转
      - 🇺🇸 美国-故转

  # 日本组
  - name: 🇯🇵 日本-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 🇯🇵 日本-手动
      - 🇯🇵 日本-自动

  - name: 🇯🇵 日本-手动
    type: select
    include-all: true
    filter: "(日甲|hysteria2|vless|trojan)"

  - name: 🇯🇵 日本-自动
    type: url-test
    tolerance: 50
    interval: 180
    include-all: true
    filter: "(日甲|hysteria2|vless|trojan)"

  # 美国组
  - name: 🇺🇸 美国-故转
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 🇺🇸 美国-手动
      - 🇺🇸 美国-自动

  - name: 🇺🇸 美国-手动
    type: select
    include-all: true
    filter: "美住"

  - name: 🇺🇸 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 180
    filter: "美住"
    
# ========================
# 规则路由策略 (自顶向下匹配)
# ========================
rules:
  - AND,(SRC-IP-CIDR,192.168.100.21/32),(DOMAIN-KEYWORD,stun),REJECT
  - AND,(SRC-IP-CIDR,192.168.100.21/32),(NETWORK,udp),(OR,(DST-PORT,3478),(DST-PORT,5349),(DST-PORT,19302)),REJECT
  - RULE-SET,Private / Domain,🇨🇳 国内
  - RULE-SET,Private / IP,🇨🇳 国内,no-resolve
  - RULE-SET,TEST / Domain,🧪 Test
  - RULE-SET,Direct / Domain,🇨🇳 国内
  - RULE-SET,AI / Domain,🧠 AI
  - RULE-SET,Shopping / Domain,🛍️ Shopping
  - RULE-SET,PayPal / Domain,💳 PayPal
  - RULE-SET,Apple-Custome / Domain,🍏 Apple
